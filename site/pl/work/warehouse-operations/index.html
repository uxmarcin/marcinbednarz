const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:D.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.n)},key,b64(D.c));
  return new TextDecoder().decode(pt);
}
async function go(pw,silent){
  if(!window.crypto||!crypto.subtle){if(location.protocol==='http:'){location.replace('https://'+location.host+location.pathname);return;}document.getElementById('e').textContent="Tę stronę można otworzyć tylko przez bezpieczne połączenie (https).";return;}
  try{const h=await open(pw);try{sessionStorage.setItem('mb-pw',pw)}catch(e){}document.open();document.write(h);document.close();}
  catch(e){if(!silent)document.getElementById('e').textContent="Hasło się nie zgadza. Sprawdź CV albo napisz do mnie.";}
}
let saved=null;try{saved=sessionStorage.getItem('mb-pw')}catch(e){}
if(saved)go(saved,true);
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();go(document.getElementById('p').value)});
</script></body></html>
